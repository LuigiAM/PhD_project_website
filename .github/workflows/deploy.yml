name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
        with:
          # Full history: the sitemap's lastmod comes from each page's last commit
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # We have removed the 'cache: npm' line to force a fresh install
          
      - name: Install dependencies 🔧
        run: npm install

      - name: Build 🏗️
        run: npm run build

      - name: Deploy 🚀
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

      # Tell IndexNow search engines (Bing, Yandex, Seznam, Naver; not Google) about the URLs.
      # The key file public/<key>.txt proves we own the host.
      - name: Notify IndexNow 📣
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          HOST: memopad.luigiandreamoretti.com
          INDEXNOW_KEY: eb3a451cc86fc520a80092c9b82f4cc8
        run: |
          # GitHub Pages publishes the gh-pages branch asynchronously: wait for the key file, then a bit more.
          for i in $(seq 1 30); do
            [ "$(curl -fsS "https://$HOST/$INDEXNOW_KEY.txt" 2>/dev/null)" = "$INDEXNOW_KEY" ] && break
            sleep 10
          done
          sleep 60
          urls=$(grep -o '<loc>[^<]*</loc>' dist/sitemap-0.xml | sed -E 's#</?loc>##g' | jq -R . | jq -s .)
          jq -n --arg host "$HOST" --arg key "$INDEXNOW_KEY" --argjson urls "$urls" \
            '{host: $host, key: $key, keyLocation: "https://\($host)/\($key).txt", urlList: $urls}' > indexnow.json
          echo "Submitting $(jq '.urlList | length' indexnow.json) URLs"
          status=$(curl -sS -o response.txt -w '%{http_code}' -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' --data-binary @indexnow.json)
          echo "IndexNow HTTP $status"; cat response.txt
          case "$status" in 200|202) ;; *) exit 1 ;; esac
